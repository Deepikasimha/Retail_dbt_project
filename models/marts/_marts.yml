version: 2
models:
  - name: dim_customers
    columns:
      - name: CUSTOMER_ID
        data_tests:
          - unique
          - not_null

      - name: CUSTOMER_NAME
        data_tests:
          - not_null

  - name: dim_products
    columns:
      - name: PRODUCT_ID
        data_tests:
          - unique
          - not_null


  - name: fact_orders
    columns:
      - name: ORDER_ID
        data_tests:
          - unique
          - not_null

      - name: CUSTOMER_ID
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: CUSTOMER_ID